<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}모의 CRM{% endblock %} | FinGuard CRM</title>
<style>
  body { margin: 0; font-family: 'Noto Sans KR', Arial, sans-serif; background: #f4f7fb; color: #17243a; }
  header { background: #101d36; color: #fff; padding: 14px 24px; display: flex; gap: 20px; align-items: center; }
  header a { color: #b7d4ff; text-decoration: none; }
  main { max-width: 900px; margin: 24px auto; padding: 0 16px; }
  .card { background: #fff; border: 1px solid #e1e7f0; border-radius: 12px; padding: 24px; }
  label { display: block; font-weight: 700; margin: 14px 0 6px; }
  input, select, textarea { width: 100%; box-sizing: border-box; padding: 9px; border: 1px solid #c9d3e1; border-radius: 6px; font: inherit; }
  textarea { min-height: 110px; }
  button { margin-top: 18px; padding: 10px 22px; background: #2563eb; color: #fff; border: 0; border-radius: 6px; font-weight: 700; cursor: pointer; }
  .error { background: #fdecec; color: #a31515; padding: 10px 14px; border-radius: 6px; }
  .notice { background: #fff8e8; padding: 10px 14px; border-radius: 6px; }
  table { width: 100%; border-collapse: collapse; background: #fff; }
  th, td { border-bottom: 1px solid #e1e7f0; padding: 9px 10px; text-align: left; font-size: 14px; }
  th { background: #edf3fb; }
  .hint { color: #627087; font-size: 13px; }
  .hidden { display: none; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 13px; font-weight: 700; }
  .badge-low { background: #e3f6ea; color: #087f5b; }
  .badge-medium { background: #fff3cd; color: #92650c; }
  .badge-high { background: #fdecec; color: #a31515; }
  .actions-row { display: flex; gap: 10px; align-items: center; }
  .secondary { background: #fff; color: #2563eb; border: 1px solid #2563eb; }
</style>
</head>
<body>
<header>
  <b>FinGuard 모의 CRM</b>
  <a id="nav-consultation" href="{{ url_for('consultation_form') }}">상담 입력</a>
  <a id="nav-new" href="{{ url_for('crm_incident_form') }}">사고 접수</a>
  <a id="nav-list" href="{{ url_for('crm_incident_list') }}">접수 목록</a>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
